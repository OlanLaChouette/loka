# Déploiement gratuit de Loka : Render (offre gratuite) pour l'API et le site, Neon (gratuit) pour PostgreSQL.
# Les logos et photos sont rangés dans la base : aucun disque payant n'est nécessaire.
# Au démarrage, l'API prépare la base (tables, compte limité, séparation des bailleurs)
# et crée le compte d'administration Loka défini par ADMIN_NOM / ADMIN_TELEPHONE / ADMIN_MOT_DE_PASSE.
services:
  - type: web
    name: loka-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/scripts/creer-base.js && node server.js
    healthCheckPath: /api/sante
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # adresse Neon (compte propriétaire)
        sync: false
      - key: DB_APP_USER
        value: loka_app
      - key: DB_APP_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL          # adresse du site loka-web
        sync: false
      - key: ADMIN_NOM
        sync: false
      - key: ADMIN_TELEPHONE
        sync: false
      - key: ADMIN_MOT_DE_PASSE    # à choisir soi-même, 10 caractères minimum
        sync: false

  - type: web
    name: loka-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL          # adresse du service loka-api
        sync: false
